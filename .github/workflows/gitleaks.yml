# Secret scan of every pull request (its own commits only) and of every push
# to main. The gitleaks CLI is pinned by version and SHA-256; the reviewed
# allowlist is .gitleaks.toml.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.1 (pinned by SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan the commits of this change
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif git rev-parse -q --verify "$AFTER~1^{commit}" >/dev/null; then
            range="$AFTER~1..$AFTER"
          else
            range="$AFTER"
          fi
          echo "scanning $range"
          gitleaks git --no-banner --redact --exit-code 1 -c .gitleaks.toml --log-opts="$range" .
